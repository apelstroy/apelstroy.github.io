:root[data-theme="dark"]{

.seg button{border:0;border-radius:0}

  else { var o = ORB[mode]; o.az -= dx*0.006; o.el = Math.max(mode==='out'?0.04:0.2,Math.min(1.5,o.el+dy*0.006)); }
});
function up(e){ var p = ptr[e.pointerId]; if(p && p.role==='move'){ stick.x = stick.y = 0; } delete ptr[e.pointerId]; }
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', function(e){ if(mode!=='walk'){ var o = ORB[mode]; o.d = Math.max(6,Math.min(45,o.d*(1+e.deltaY*0.001))); e.preventDefault(); } }, {passive:false});

/* ---------- minimap ---------- */
var map = $('map'), mg = map.getContext('2d'), MX = -0.6, MZ = -0.6, MW = 12.7, MH = 10.2, ms = 1;
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function drawMap(){
  var w = map.clientWidth, h = map.clientHeight, dpr = Math.min(devicePixelRatio||1,2);
  if(map.width !== Math.round(w*dpr)){ map.width = Math.round(w*dpr); map.height = Math.round(h*dpr); }
  ms = Math.min(w/MW, h/MH);
  mg.setTransform(dpr*ms,0,0,dpr*ms,-MX*ms*dpr,-MZ*ms*dpr); mg.clearRect(MX,MZ,MW+2,MH+2);
  var here = mode==='walk' ? roomAt(pos.x,pos.z) : null;
  ROOMS.forEach(function(rm){ mg.fillStyle = rm===here ? css('--accent') : css('--line'); mg.globalAlpha = rm===here ? 0.55 : 0.5;
    rm.r.forEach(function(q){ mg.fillRect(q[0]*M,q[1]*M,(q[2]-q[0])*M,(q[3]-q[1])*M); }); });
  mg.globalAlpha = 1; mg.fillStyle = css('--ink');
  colliders.forEach(function(c){ mg.fillRect(c[0],c[1],c[2]-c[0],c[3]-c[1]); });
  mg.save(); mg.translate(pos.x,pos.z); mg.rotate(-yaw); mg.fillStyle = css('--accent');
  mg.beginPath(); mg.moveTo(0,-0.55); mg.lineTo(0.33,0.3); mg.lineTo(-0.33,0.3); mg.closePath(); mg.fill(); mg.restore();
}
map.addEventListener('click', function(e){
  var b = map.getBoundingClientRect(), x = (e.clientX-b.left)/ms+MX, z = (e.clientY-b.top)/ms+MZ;
  if(hit(x,z)) return; pos.x = x; pos.z = z; floorNow = floorY(x,z); if(mode!=='walk') setMode('walk');
});

/* ---------- VR ---------- */
var vrBtn = $('vr'), session = null, aiming = null, snapReady = true;
var marker = new THREE.Mesh(new THREE.RingGeometry(0.18,0.26,32), new THREE.MeshBasicMaterial({color:0xd9774f, side:THREE.DoubleSide}));
marker.rotation.x = -Math.PI/2; marker.visible = false; scene.add(marker);
[0,1].forEach(function(i){
  var c = renderer.xr.getController(i);
  var g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]);
  var l = new THREE.Line(g, new THREE.LineBasicMaterial({color:0xd9774f})); l.scale.z = 4; c.add(l);
  c.addEventListener('selectstart', function(){ aiming = c; });
  c.addEventListener('selectend', function(){
    if(aiming===c && marker.visible){ var h = head(); rig.position.x += marker.position.x-h.x; rig.position.z += marker.position.z-h.z; }
    aiming = null; marker.visible = false;
  });
  rig.add(c);
});
var vHead = new THREE.Vector3(), vDir = new THREE.Vector3(), vA = new THREE.Vector3(), vB = new THREE.Vector3(), UP = new THREE.Vector3(0,1,0);
function head(){ var xc = renderer.xr.getCamera(camera); vHead.setFromMatrixPosition(xc.matrixWorld); return vHead; }
function vrUpdate(dt){
  var h = head(), e = renderer.xr.getCamera(camera).matrixWorld.elements;
  vDir.set(-e[8],0,-e[10]); if(vDir.lengthSq()<1e-6) vDir.set(0,0,-1); vDir.normalize();
  var mvx = 0, mvy = 0, turn = 0, src = session.inputSources;
  for(var i=0;i<src.length;i++){ var gp = src[i].gamepad; if(!gp) continue;
    var ax = gp.axes.length>=4 ? gp.axes[2] : (gp.axes[0]||0), ay = gp.axes.length>=4 ? gp.axes[3] : (gp.axes[1]||0);
    if(src[i].handedness==='right' && src.length>1) turn = ax; else { mvx = ax; mvy = ay; } }
  if(Math.abs(mvx)>0.15 || Math.abs(mvy)>0.15){
    var sp = 1.6*dt, dx = (vDir.x*-mvy + -vDir.z*mvx)*sp, dz = (vDir.z*-mvy + vDir.x*mvx)*sp;
    if(!hit(h.x+dx,h.z)) rig.position.x += dx; if(!hit(h.x,h.z+dz)) rig.position.z += dz;
  }
  if(Math.abs(turn)>0.6){ if(snapReady){ snapReady = false; var a = (turn>0?-1:1)*Math.PI/6, ry = rig.position.y;
      vA.copy(rig.position).sub(h).applyAxisAngle(UP,a).add(h); vA.y = ry; rig.position.copy(vA); rig.rotation.y += a; } }
  else if(Math.abs(turn)<0.3) snapReady = true;
  if(aiming){
    aiming.getWorldPosition(vA); aiming.getWorldDirection(vB).negate();
    if(vB.y < -0.05){ var t = (rig.position.y-SIT-vA.y)/vB.y, x = vA.x+vB.x*t, z = vA.z+vB.z*t;
      marker.visible = t>0 && t<16 && !hit(x,z); marker.position.set(x,floorY(x,z)+0.03,z); }
    else marker.visible = false;
  }
  floorNow += (floorY(h.x,h.z)+SIT-floorNow)*Math.min(1,dt*8); rig.position.y = floorNow;
  pos.x = h.x; pos.z = h.z; yaw = Math.atan2(-vDir.x,-vDir.z);
}
function vrOff(msg){ vrBtn.disabled = true; vrBtn.textContent = msg; }
if(navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
    if(!ok) return vrOff('VR недоступен в этом окне');
    vrBtn.disabled = false; vrBtn.textContent = 'Войти в VR';
  }).catch(function(){ vrOff('VR недоступен в этом окне'); });
} else vrOff('VR недоступен в этом окне');
vrBtn.onclick = function(){
  if(session){ session.end(); return; }
  renderer.xr.setFramebufferScaleFactor(HI ? 1.3 : 1.0);
  navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']}).then(function(s){
    session = s; setMode('walk'); floorNow = floorY(pos.x,pos.z);
    rig.position.set(pos.x,floorNow,pos.z); rig.rotation.set(0,yaw,0); camera.position.set(0,0,0); camera.rotation.set(0,0,0);
    renderer.xr.setReferenceSpaceType('local-floor'); renderer.xr.setSession(s);
    vrBtn.textContent = 'Выйти из VR';
    s.addEventListener('end', function(){ session = null; aiming = null; marker.visible = false; vrBtn.textContent = 'Войти в VR'; resize(); });
  }).catch(function(){ vrOff('Не удалось запустить VR'); });
};

/* ---------- loop ---------- */
function resize(){ var w = innerWidth, h = innerHeight; if(renderer.xr.isPresenting) return;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
window.__tour = { cam:camera, room:function(){ var r=roomAt(pos.x,pos.z); return r ? r.n+' · '+r.a+' м²' : ''; }, go:function(x,z,y,p){ pos.x = x; pos.z = z; yaw = y||0; pitch = p||0; floorNow = floorY(x,z); setMode('walk'); }, mode:setMode, orbit:function(m,az,el,d){ ORB[m].az = az; ORB[m].el = el; ORB[m].d = d; setMode(m); } };
var last = performance.now(), tick = 0;
renderer.setAnimationLoop(function(now){
  var dt = Math.min(0.05,(now-last)/1000); last = now;
  if(renderer.xr.isPresenting && session) vrUpdate(dt);
  else if(mode==='walk'){
    var f = (keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y, s = (keys.KeyD?1:0)-(keys.KeyA?1:0)+stick.x;
    if(keys.ArrowLeft) yaw += 1.8*dt; if(keys.ArrowRight) yaw -= 1.8*dt;
    var sp = (keys.ShiftLeft?3.2:1.7)*dt;
    if(f||s) move((-Math.sin(yaw)*f + Math.cos(yaw)*s)*sp, (-Math.cos(yaw)*f - Math.sin(yaw)*s)*sp);
    floorNow += (floorY(pos.x,pos.z)-floorNow)*Math.min(1,dt*8);
    rig.position.set(pos.x,floorNow,pos.z); rig.rotation.set(0,yaw,0); camera.position.set(0,SIT?EYE-0.45:EYE,0); camera.rotation.set(pitch,0,0);
  } else {
    var o = ORB[mode], d = o.d/Math.min(1,camera.aspect*0.9);
    rig.position.set(0,0,0); rig.rotation.set(0,0,0);
    camera.position.set(o.t.x+d*Math.cos(o.el)*Math.sin(o.az), o.t.y+d*Math.sin(o.el), o.t.z+d*Math.cos(o.el)*Math.cos(o.az));
    camera.lookAt(o.t);
  }
  if((tick++ % 6)===0){
    var rm = mode==='walk' ? roomAt(pos.x,pos.z) : null;
    $('room').innerHTML = mode==='out' ? 'Вид снаружи' : mode==='top' ? 'План, крыша снята' : rm ? rm.n+' <b>'+rm.a+' м²</b>' : 'Снаружи дома';
    drawMap();
  }
  renderer.render(scene,camera);
});
quality(HI); setMode('out');
})();
</script>

</body></html>
